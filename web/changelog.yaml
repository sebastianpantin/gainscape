- prs: [157]
  version: 0.17.0
  date: 2026-10-20
  title: A livelier Train tab
  items:
    - Train opens with This week, a strip of the week that lights up the days you trained and shows your weekly goal streak. Tap it to open Stats.
    - A progress card shows your companion bigger, your equipped gear, an XP bar for the skill closest to levelling up and a bar for your current quest step.
    - Highlights shows how long since your last workout, your latest record and your rarest drop of the last 30 days.
- prs: [154, 155]
  version: 0.16.0
  date: 2026-10-20
  title: Stats
  items:
    - A new Stats page under Collection. A training calendar lights up the days you trained, and each month is compared with the one before for workouts, volume, records and XP.
    - See your working sets per week for any muscle over the last 12 weeks, against the 10 to 20 sets target.
    - Every record you have set, newest first, each linking to its workout.
    - Loot stats show how your drops compare with the odds, plus your current and longest dry streak.
    - Follow a barbell lift as a multiple of your bodyweight over time, and get a DOTS score for your squat, bench and deadlift once you pick a sex in Settings.
    - Stats keep showing your last loaded numbers when you are offline.
- prs: [152]
  version: 0.15.1
  date: 2026-10-18
  title: Faster everywhere
  items:
    - Finishing a workout syncs faster, and the friends feed and lift progress pages load quicker.
    - The app is a smaller download to install and update.
- prs: [149, 150]
  version: 0.15.0
  date: 2026-10-17
  title: Goals and luck
  items:
    - Set a goal on any weighted lift, like 100 kg for 5 reps by a date you choose. Its progress page shows how close you are, and Today lists your goals.
    - A goal counts as reached once you lift the weight for the reps. Weighted pull-ups and dips take a goal for the added weight.
    - Items has a Luck panel that shows your chance of a drop on the next loot roll. Every roll that misses raises it, up to 40%.
- prs: [147]
  version: 0.14.0
  date: 2026-10-16
  title: Easier logging
  items:
    - New sets start unticked with your last weights filled in. Tick Done to log each one and start your rest.
    - Removed a set by mistake? Tap Undo to put it back. Removing an exercise with sets in it, or discarding a workout, now asks first.
    - Every screen that fails to load offers Try again, and leaving an edit with unsaved changes asks before throwing them away.
    - Followed programs show their sets in short lines like 5 × 5 @ 100 kg, with Start at the top, and each template says how often it trains.
    - The workout summary shows how much XP is left to each next level, and game words like total level, combat level and gz now have help.
    - Back links on Programs, Exercises and Quests, clearer search results when adding an exercise, and a layout that fits small phones.
- prs: [145]
  version: 0.13.2
  date: 2026-10-16
  title: Steadier summaries
  items:
    - The workout summary keeps your loot names even when your connection drops for a moment, and a past workout shows its loot names offline too.
- prs: [140, 141, 142, 143]
  version: 0.13.1
  date: 2026-10-16
  title: Smoother saves
  items:
    - Workouts no longer get stuck waiting to sync after a game update. They save straight away.
    - Editing an older workout is much faster when you have a long training history.
    - A new bodyweight, unit setting or program change now shows up on every screen straight away.
- prs: [138]
  version: 0.13.0
  date: 2026-10-15
  title: Easier swaps
  items:
    - When you swap an exercise during a workout, the picker now suggests similar lifts that train the same muscles, before you type anything.
- prs: [128, 130]
  version: 0.12.0
  date: 2026-10-14
  title: A tidier Skills tab
  items:
    - The Skills tab is less crowded. It shows your levels, Quests and a new Body page, with a short summary of how your muscles are doing.
    - Tap a skill to open its own page with your level, XP and the exercises that train it. Muscle skills also show when that muscle is fresh again and your sets for it this week.
    - The Body page holds the Recovery map and your weekly sets, and each muscle links to its skill page.
- prs: [126]
  version: 0.11.0
  date: 2026-10-14
  title: Smarter training
  items:
    - Skills has a Weekly volume panel that counts your sets for each muscle this week against a target of 10 to 20. Tap a muscle to see which exercises counted.
    - A lift that has not improved for at least 4 workouts and 3 weeks shows as Stalled on its progress page, with tips to deload, change your rep range or try a variation. Lifts your program runs are left to the program.
    - Add warm-ups now builds a warm-up ramp for dumbbell, machine and cable lifts too, not just barbell lifts.
    - Warm-up sets look lighter in History, so your working sets stand out.
- prs: [124]
  version: 0.10.0
  date: 2026-10-14
  title: Quests
  items:
    - Quests are here. Open Quests from the Skills tab and start one once you meet its level and quest requirements.
    - Each quest has steps, like a set number of workouts, a total of reps or kilos, a new record or a set workout. Workouts you finish after starting count toward the next step.
    - Finishing a quest gives bonus skill XP and quest points, and some quests unlock the next one in a chain.
    - Your quest points show on your profile, and friends see your finished quests in the feed.
- prs: [121, 122]
  version: 0.9.0
  date: 2026-10-14
  title: Recovery countdown
  items:
    - The Recovery panel on Skills shows how long until each tired muscle is fresh again.
- prs: [119]
  version: 0.8.2
  date: 2026-10-13
  title: A proper launch screen
  items:
    - On iPhone and iPad, the app shows its logo while it starts from your home screen instead of a blank screen.
- prs: [113, 114, 116, 117]
  version: 0.8.1
  date: 2026-10-13
  title: Smoother shortcuts
  items:
    - The Program and Skills shortcuts on your home screen have their own icons, and opening one while the app is already open takes you there without starting it again.
    - Installing the app on a computer shows a preview of a workout.
- prs: [109, 110, 111]
  version: 0.8.0
  date: 2026-10-13
  title: A livelier app
  items:
    - Rare and legendary loot glows when you open the chest and plays its own fanfare. Crafting shows what you made with an anvil chime.
    - Your workout XP counts up on the summary, and your Total and Combat levels count up on Today when they rise.
    - Today greets you, shows the skill closest to its next level, warns when your weekly streak is at risk, and shows what your friends have been up to.
    - Short messages confirm things like friend requests, saved changes and equipped gear, and screens fade in as you move between them.
    - Skills has a Recovery map that shows which muscles are still recovering from your recent hard sets.
    - Your newest pet follows you on Today. Pick a different one from its page in Items.
- prs: [105, 107]
  version: 0.7.0
  date: 2026-10-13
  title: Start over from scratch
  items:
    - Settings has a Reset all data button. Type RESET to wipe your workouts, XP, records, loot, gear, bodyweight log, notes and goals and start again from level 1.
    - Your account, profile, friends, settings, custom exercises and programs stay. Your old posts leave your friends' feeds.
- prs: [103]
  version: 0.6.4
  date: 2026-10-13
  title: Numbers you can read at a glance
  items:
    - Titles, XP, levels and the rest timer use a new pixel font where every digit is easy to tell apart.
- prs: [101]
  version: 0.6.3
  date: 2026-10-13
  title: A way out of the program builder
  items:
    - The program builder has a Cancel button. It leaves at once when nothing changed, and asks before throwing away unsaved changes.
- prs: [100]
  version: 0.6.2
  date: 2026-10-13
  title: History that remembers your place
  items:
    - Going back from an older workout returns you to the same spot in History, with every workout you loaded still there. A deleted workout leaves the list at once.
    - The Progress link waits until your changes to a workout are saved, so it can no longer drop them.
    - The program builder asks for at least one exercise, never repeats a day name, and clears an error once you fix it.
    - Number fields only take plain numbers, so text like 1e2 is no longer read as 100.
    - Screen readers hear which Collection tab you are on.
- prs: [98]
  version: 0.6.1
  date: 2026-10-12
  title: Easier to tap
  items:
    - Back links, small links, switches and the weekly goal picker are bigger and easier to hit with one thumb. The weekly goal picker now sits on two rows.
    - Your profile no longer jumps while your loadout loads.
    - A friend's profile now opens with their name as the page heading, so screen readers start there.
- prs: [90, 91, 92, 93, 95]
  version: 0.6.0
  date: 2026-10-12
  title: Faster logging and a livelier workout
  items:
    - Set rows are compact, show what you lifted last time with one tap to repeat it, and mark whether you beat it. Finishing a set drops its XP with a short buzz.
    - A bar above the tabs keeps your workout time and rest countdown in view on every screen, and the rest alert reaches you there too. The rest timer is one slim line that counts the time past your rest.
    - The end-of-workout reveal is quicker and can be skipped. Level-ups chime, and your loot waits in a chest you tap to open.
    - New players get a short intro to skills, records and loot, choose kg or lb, and pick a first program or an empty workout.
    - History shows the main exercises, volume and records of each workout and loads more as you scroll. The Log tab is now called Collection.
    - Screens open faster, text is easier to read, number fields select their value when you tap them, and screen readers and keyboards follow you from screen to screen.
- prs: [84, 88]
  version: 0.5.1
  date: 2026-10-11
  title: Smoother screens and fixes
  items:
    - Profile, hiscores, friends and program screens show what you saw last right away, then refresh in the background.
    - A workout stops at 200 sets while you log it, instead of failing when you finish. The same goes for 4 hours of cardio, also when you pick a new cardio exercise.
    - Archived exercises no longer show up in the exercise picker when you are offline.
    - A program you follow no longer says it is out of date after you change an exercise to bodyweight.
    - Deleting your account clears all of your data from this device, and items show up right after crafting.
    - Your data export now includes every version of the custom programs you have followed.
- prs: [83, 85]
  version: 0.5.0
  date: 2026-10-11
  title: Build your own programs, plus Grip and Mobility
  items:
    - Create a program from scratch, and choose for each exercise whether to use your last weight, a fixed weight, or add weight after every workout where you hit all your reps.
    - Follow your own program like a built-in one. Edit it later and pick up the changes without losing your working weights.
    - New Grip skill. Wrist curls train it, and deadlifts, rows, pull-ups and shrugs now give it a share of their XP.
    - Log dead hangs, plate pinches and farmer's carries by seconds or metres, and set records for your longest hold and farthest carry.
    - New Mobility skill for yoga, stretching and foam rolling, with its own time cap so it never eats into your cardio.
    - Exercise search no longer matches letters that run across two words, so short searches find what you meant.
- prs: [80]
  version: 0.4.0
  date: 2026-10-10
  title: 166 new exercises and 24 new scrolls
  items:
    - 166 new built-in exercises, from Pendlay rows and hack squats to kettlebell swings and Turkish get-ups.
    - Exercise search puts the closest match first, ignores hyphens and apostrophes, and tells you when more matches are hidden.
    - 24 new scroll challenges use the new exercises. Your chance of finding a scroll on a personal record is unchanged.
- prs: [78]
  version: 0.3.2
  date: 2026-10-10
  title: Clearer error messages
  items:
    - A failed email change, data export, account deletion or pin now says what went wrong in plain words instead of a code.
    - The History tab's load error goes away once loading older workouts works again.
- prs: [77]
  version: 0.3.1
  date: 2026-10-10
  title: Steadier workouts and friends
  items:
    - An unsynced workout saved on this device is never hidden, and a finished or discarded one never comes back.
    - The friends feed shows each friend's @username, and friend lists update right after you act.
    - Display names can no longer look blank or flip text direction.
    - Editing an old workout only re-checks loot on the sets you changed.
    - You stay signed in when the server has a short outage, and a failed password reset tells you why.
    - Challenges start at the right weights offline, and the summary says when one could not be applied.
- prs: [76]
  version: 0.3.0
  date: 2026-10-09
  title: Discard a workout and safer logging
  items:
    - You can now discard a workout you have started, from the button below Finish.
    - Weight and reps fields can be cleared and retyped, and accept a comma as the decimal point.
    - Workouts are no longer lost when the app can't read this device's storage, or when you finish long after starting.
    - Unrated high-rep sets now earn XP, and XP and records are worked out more fairly.
    - 5/3/1, Madcow, GZCLP, Texas Method and StrongLifts now progress the way the real programs do.
- prs: [69, 70, 71, 72, 73]
  version: 0.2.0
  date: 2026-10-09
  title: Six new scroll challenges
  items:
    - Six new scroll challenges to find in rare loot, including Push-up Century and Twenty-Ton Day.
    - Ten-Ton Day and Twenty-Ton Day now count only the weight you load, not your bodyweight.
    - A challenge that sets its loads from your e1RM now asks you to log that lift first, so you never spend a scroll on a challenge you can't pass.
