- prs: [101]
  version: 0.6.3
  date: 2026-10-13
  title: A way out of the program builder
  items:
    - The program builder has a Cancel button. It leaves at once when nothing changed, and asks before throwing away unsaved changes.
- prs: [100]
  version: 0.6.2
  date: 2026-10-13
  title: History that remembers your place
  items:
    - Going back from an older workout returns you to the same spot in History, with every workout you loaded still there. A deleted workout leaves the list at once.
    - The Progress link waits until your changes to a workout are saved, so it can no longer drop them.
    - The program builder asks for at least one exercise, never repeats a day name, and clears an error once you fix it.
    - Number fields only take plain numbers, so text like 1e2 is no longer read as 100.
    - Screen readers hear which Collection tab you are on.
- prs: [98]
  version: 0.6.1
  date: 2026-10-12
  title: Easier to tap
  items:
    - Back links, small links, switches and the weekly goal picker are bigger and easier to hit with one thumb. The weekly goal picker now sits on two rows.
    - Your profile no longer jumps while your loadout loads.
    - A friend's profile now opens with their name as the page heading, so screen readers start there.
- prs: [90, 91, 92, 93, 95]
  version: 0.6.0
  date: 2026-10-12
  title: Faster logging and a livelier workout
  items:
    - Set rows are compact, show what you lifted last time with one tap to repeat it, and mark whether you beat it. Finishing a set drops its XP with a short buzz.
    - A bar above the tabs keeps your workout time and rest countdown in view on every screen, and the rest alert reaches you there too. The rest timer is one slim line that counts the time past your rest.
    - The end-of-workout reveal is quicker and can be skipped. Level-ups chime, and your loot waits in a chest you tap to open.
    - New players get a short intro to skills, records and loot, choose kg or lb, and pick a first program or an empty workout.
    - History shows the main exercises, volume and records of each workout and loads more as you scroll. The Log tab is now called Collection.
    - Screens open faster, text is easier to read, number fields select their value when you tap them, and screen readers and keyboards follow you from screen to screen.
- prs: [84, 88]
  version: 0.5.1
  date: 2026-10-11
  title: Smoother screens and fixes
  items:
    - Profile, hiscores, friends and program screens show what you saw last right away, then refresh in the background.
    - A workout stops at 200 sets while you log it, instead of failing when you finish. The same goes for 4 hours of cardio, also when you pick a new cardio exercise.
    - Archived exercises no longer show up in the exercise picker when you are offline.
    - A program you follow no longer says it is out of date after you change an exercise to bodyweight.
    - Deleting your account clears all of your data from this device, and items show up right after crafting.
    - Your data export now includes every version of the custom programs you have followed.
- prs: [83, 85]
  version: 0.5.0
  date: 2026-10-11
  title: Build your own programs, plus Grip and Mobility
  items:
    - Create a program from scratch, and choose for each exercise whether to use your last weight, a fixed weight, or add weight after every workout where you hit all your reps.
    - Follow your own program like a built-in one. Edit it later and pick up the changes without losing your working weights.
    - New Grip skill. Wrist curls train it, and deadlifts, rows, pull-ups and shrugs now give it a share of their XP.
    - Log dead hangs, plate pinches and farmer's carries by seconds or metres, and set records for your longest hold and farthest carry.
    - New Mobility skill for yoga, stretching and foam rolling, with its own time cap so it never eats into your cardio.
    - Exercise search no longer matches letters that run across two words, so short searches find what you meant.
- prs: [80]
  version: 0.4.0
  date: 2026-10-10
  title: 166 new exercises and 24 new scrolls
  items:
    - 166 new built-in exercises, from Pendlay rows and hack squats to kettlebell swings and Turkish get-ups.
    - Exercise search puts the closest match first, ignores hyphens and apostrophes, and tells you when more matches are hidden.
    - 24 new scroll challenges use the new exercises. Your chance of finding a scroll on a personal record is unchanged.
- prs: [78]
  version: 0.3.2
  date: 2026-10-10
  title: Clearer error messages
  items:
    - A failed email change, data export, account deletion or pin now says what went wrong in plain words instead of a code.
    - The History tab's load error goes away once loading older workouts works again.
- prs: [77]
  version: 0.3.1
  date: 2026-10-10
  title: Steadier workouts and friends
  items:
    - An unsynced workout saved on this device is never hidden, and a finished or discarded one never comes back.
    - The friends feed shows each friend's @username, and friend lists update right after you act.
    - Display names can no longer look blank or flip text direction.
    - Editing an old workout only re-checks loot on the sets you changed.
    - You stay signed in when the server has a short outage, and a failed password reset tells you why.
    - Challenges start at the right weights offline, and the summary says when one could not be applied.
- prs: [76]
  version: 0.3.0
  date: 2026-10-09
  title: Discard a workout and safer logging
  items:
    - You can now discard a workout you have started, from the button below Finish.
    - Weight and reps fields can be cleared and retyped, and accept a comma as the decimal point.
    - Workouts are no longer lost when the app can't read this device's storage, or when you finish long after starting.
    - Unrated high-rep sets now earn XP, and XP and records are worked out more fairly.
    - 5/3/1, Madcow, GZCLP, Texas Method and StrongLifts now progress the way the real programs do.
- prs: [69, 70, 71, 72, 73]
  version: 0.2.0
  date: 2026-10-09
  title: Six new scroll challenges
  items:
    - Six new scroll challenges to find in rare loot, including Push-up Century and Twenty-Ton Day.
    - Ten-Ton Day and Twenty-Ton Day now count only the weight you load, not your bodyweight.
    - A challenge that sets its loads from your e1RM now asks you to log that lift first, so you never spend a scroll on a challenge you can't pass.
- prs: []
  version: 0.1.0
  date: 2026-10-09
  title: Gainscape changelog
  items:
    - Gainscape now keeps a list of what changed in each release, under Settings.
    - After an update, a short What's new note lists the changes since your last visit.
