- key: x_marks_the_squat
  name: X Marks the Squat
  description: The old spotter left a map to buried gains. Squat in two workouts, then dig up a hundred squat reps.
  quest_points: 1
  steps:
    - { kind: sessions, target: 2, exercise: back_squat }
    - { kind: volume, metric: reps, target: 100, exercise: back_squat }
  rewards:
    xp: { legs: 800, core: 200 }
- key: the_restless_squat
  name: The Restless Squat
  description: A restless squat haunts the rack. Set a new back squat record, then lay it to rest with fifty reps at 70% of your best in one workout.
  quest_points: 2
  requires:
    levels: { legs: 15 }
    quests: [x_marks_the_squat]
  steps:
    - { kind: record, exercise: back_squat }
    - kind: workout
      volume: { metric: reps, target: 50, exercise: back_squat, min_pct: 70 }
  rewards:
    xp: { legs: 1500, back: 300 }
- key: back_slayer
  name: Back Slayer
  description: Only a true slayer can face the deadlift. Move twenty tonnes on it, then defeat three rounds of heavy squats and deadlifts in one workout.
  quest_points: 3
  requires:
    levels: { legs: 25, back: 20 }
    quests: [the_restless_squat]
  steps:
    - { kind: volume, metric: kg, target: 20000, exercise: deadlift }
    - kind: workout
      supersets:
        - rounds: 3
          exercises:
            - { exercise: back_squat, reps: 5, pct: 75 }
            - { exercise: deadlift, reps: 5, pct: 70 }
  rewards:
    xp: { legs: 2500, back: 1500, grip: 500 }
- key: bench_mysteries
  name: Bench Mysteries
  description: Strange markings cover the plates. Bench press in three workouts, then uncover a new bench press record.
  quest_points: 1
  steps:
    - { kind: sessions, target: 3, exercise: barbell_bench_press }
    - { kind: record, exercise: barbell_bench_press }
  rewards:
    xp: { chest: 800, arms: 200 }
- key: monkey_bar_madness
  name: Monkey Bar Madness
  description: The monkeys of the bars demand tribute. Hang from the bar in three workouts, then pull yourself up fifty times.
  quest_points: 1
  requires:
    levels: { grip: 5 }
  steps:
    - { kind: sessions, target: 3, exercise: dead_hang }
    - { kind: volume, metric: reps, target: 50, exercise: pull_up }
  rewards:
    xp: { grip: 700, back: 300 }
- key: the_grand_tread
  name: The Grand Tread
  description: The great tread calls. Go for a run four times, then set a new running record.
  quest_points: 1
  steps:
    - { kind: sessions, target: 4, exercise: running }
    - { kind: record, exercise: running }
  rewards:
    xp: { endurance: 1000 }
- key: yogic_ritual
  name: Yogic Ritual
  description: The elders teach the old stretches. Work through a mobility flow in three workouts.
  quest_points: 1
  steps:
    - { kind: sessions, target: 3, exercise: mobility_flow }
  rewards:
    xp: { mobility: 600 }
- key: ernest_the_crunch
  name: Ernest the Crunch
  description: Ernest has been turned into a crunch. Do sixty hanging leg raises in one workout, then train them in three more workouts.
  quest_points: 1
  requires:
    levels: { core: 10 }
  steps:
    - kind: workout
      volume: { metric: reps, target: 60, exercise: hanging_leg_raise }
    - { kind: sessions, target: 3, exercise: hanging_leg_raise }
  rewards:
    xp: { core: 800, shoulders: 200 }
