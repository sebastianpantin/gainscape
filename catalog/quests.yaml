- key: x_marks_the_squat
  name: X Marks the Squat
  description: The old spotter left a map to buried gains. Squat in two workouts, then dig up a hundred squat reps.
  quest_points: 1
  steps:
    - { kind: sessions, target: 2, exercise: back_squat }
    - { kind: volume, metric: reps, target: 100, exercise: back_squat }
  rewards:
    xp: { legs: 800, core: 200 }
- key: the_restless_squat
  name: The Restless Squat
  description: A restless squat haunts the rack. Set a new back squat record, then lay it to rest with fifty reps at 70% of your best in one workout.
  quest_points: 2
  requires:
    levels: { legs: 15 }
    quests: [x_marks_the_squat]
  steps:
    - { kind: record, exercise: back_squat }
    - kind: workout
      volume: { metric: reps, target: 50, exercise: back_squat, min_pct: 70 }
  rewards:
    xp: { legs: 1500, back: 300 }
- key: back_slayer
  name: Back Slayer
  description: Only a true slayer can face the deadlift. Move twenty tonnes on it, then defeat three rounds of heavy squats and deadlifts in one workout.
  quest_points: 3
  requires:
    levels: { legs: 25, back: 20 }
    quests: [the_restless_squat]
  steps:
    - { kind: volume, metric: kg, target: 20000, exercise: deadlift }
    - kind: workout
      supersets:
        - rounds: 3
          exercises:
            - { exercise: back_squat, reps: 5, pct: 75 }
            - { exercise: deadlift, reps: 5, pct: 70 }
  rewards:
    xp: { legs: 2500, back: 1500, grip: 500 }
