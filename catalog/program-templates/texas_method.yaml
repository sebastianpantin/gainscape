key: texas_method
version: 1
name: Texas Method
source:
  - https://www.liftosaur.com/programs/texasmethod
  - https://fitnessvolt.com/rpe-training/programs/texas-method/
lifts:
  - { key: squat, name: Squat, category: lower }
  - { key: press, name: Bench press or overhead press, category: upper }
  - { key: deadlift, name: Deadlift, category: lower }
inputs:
  - { lifts: [squat, press], kinds: [fiveRm] }
  - { lifts: [deadlift], kinds: [workingWeight] }
referenceVars: [fiveRm, workingWeight]
initial:
  - { kind: copy, var: fiveRm, from: fiveRm }
  - { kind: copy, var: workingWeight, from: workingWeight }
options:
  - key: pressLift
    kind: choice
    values: [bench, ohp]
    default: bench
    source:
      - https://www.liftosaur.com/programs/texasmethod
conversions:
  - { lb: 5, kg: 2.5, note: weekly increase of the Friday 5RM and the Monday deadlift }
schedule:
  kind: weekly
  days:
    - key: mon
      name: Day 1
      slots:
        - id: mon-squat
          lift: squat
          role: main
          scheme: { kind: repeat, count: 5, reps: 5, load: { kind: pct, pct: 0.9, of: fiveRm } }
        - id: mon-press
          lift: press
          role: main
          scheme: { kind: repeat, count: 5, reps: 5, load: { kind: pct, pct: 0.9, of: fiveRm } }
        - id: mon-deadlift
          lift: deadlift
          role: main
          scheme: { kind: repeat, count: 1, reps: 5, load: { kind: pct, pct: 1, of: workingWeight } }
    - key: wed
      name: Day 2
      slots:
        - id: wed-squat
          lift: squat
          role: main
          scheme:
            kind: repeat
            count: 2
            reps: 5
            load: { kind: pctOfSlot, day: mon, slot: mon-squat, idx: 0, pct: 0.8 }
    - key: fri
      name: Day 3
      slots:
        - id: fri-squat
          lift: squat
          role: main
          scheme: { kind: repeat, count: 1, reps: 5, load: { kind: pct, pct: 1, of: fiveRm, add: { kg: 2.5, lb: 5 } } }
        - id: fri-press
          lift: press
          role: main
          scheme: { kind: repeat, count: 1, reps: 5, load: { kind: pct, pct: 1, of: fiveRm, add: { kg: 2.5, lb: 5 } } }
progression:
  - lift: squat
    var: fiveRm
    trigger: endOfWeek
    judgedSlots: [fri-squat]
    onMet:
      - { kind: increment, by: { kg: 2.5, lb: 5 } }
    onMiss:
      - { kind: hold }
  - lift: press
    var: fiveRm
    trigger: endOfWeek
    judgedSlots: [fri-press]
    onMet:
      - { kind: increment, by: { kg: 2.5, lb: 5 } }
    onMiss:
      - { kind: hold }
  - lift: deadlift
    var: workingWeight
    trigger: endOfWeek
    judgedSlots: [mon-deadlift]
    onMet:
      - { kind: increment, by: { kg: 2.5, lb: 5 } }
    onMiss:
      - { kind: hold }
