name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.suite }} ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: chromium
            browser: chromium
            shard: 1/2
            run: make e2e CHROMIUM_PATH= E2E_ARGS=--shard=1/2
          - suite: chromium
            browser: chromium
            shard: 2/2
            run: make e2e CHROMIUM_PATH= E2E_ARGS=--shard=2/2
          - suite: webkit
            browser: webkit
            shard: 1/2
            run: make e2e-webkit E2E_ARGS=--shard=1/2
          - suite: webkit
            browser: webkit
            shard: 2/2
            run: make e2e-webkit E2E_ARGS=--shard=2/2
          - suite: pwa and pages
            browser: chromium
            shard: ''
            run: make -k e2e-pwa e2e-pages CHROMIUM_PATH=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - run: make ci-start
      - run: ${{ matrix.run }}
      - if: failure()
        run: make ci-logs
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs-${{ strategy.job-index }}
          path: |
            ci-logs/
            playwright-report/
            test-results/
            .functions-serve.log
          if-no-files-found: ignore
      - if: always()
        run: make stop
