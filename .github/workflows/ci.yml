name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - id: changes
        run: make ci-changes
      - run: npm ci
      - if: steps.changes.outputs.code == 'false'
        run: make format-check secrets-scan
      - if: steps.changes.outputs.code != 'false'
        run: make check
      - if: steps.changes.outputs.code != 'false'
        run: make test-catalog test-domain test-web test-deploy
      - if: steps.changes.outputs.code != 'false'
        run: make sim-check
      - if: steps.changes.outputs.code != 'false'
        run: make build

  backend:
    name: Backend integration and pgTAP
    needs: checks
    if: needs.checks.outputs.backend != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make ci-start
      - run: make test-integration
      - run: make test-db
      - if: failure()
        run: make ci-logs
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-logs
          path: |
            ci-logs/
            .functions-serve.log
          if-no-files-found: ignore
      - if: always()
        run: make stop
