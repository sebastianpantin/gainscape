name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: make check
      - run: make test-catalog test-domain test-web
      - run: make sim-check

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make ci-start
      - run: make test-integration
      - run: make test-db
      - run: make e2e CHROMIUM_PATH=
      - if: failure()
        run: make ci-logs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs
          path: |
            ci-logs/
            playwright-report/
            test-results/
            .functions-serve.log
          if-no-files-found: ignore
      - if: always()
        run: make stop
